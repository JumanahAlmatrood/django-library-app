<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments with More Than Two Students</title>
</head>
<body>
    <h1>Departments with More Than Two Students</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Department Name</th>
                <th>Student Count</th>
            </tr>
        </thead>
        <tbody>
            {% for department in departments %}
                <tr>
                    <td>{{ department.name }}</td>
                    <td>{{ department.student_count }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>

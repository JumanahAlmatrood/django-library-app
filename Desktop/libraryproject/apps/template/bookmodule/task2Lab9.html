<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses with Student Count</title>
</head>
<body>
    <h1>Courses with Student Count</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Course Title</th>
                <th>Student Count</th>
            </tr>
        </thead>
        <tbody>
            {% for course in courses %}
                <tr>
                    <td>{{ course.title }}</td>
                    <td>{{ course.student_count }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oldest Student Per Department</title>
</head>
<body>
    <h1>Oldest Student Per Department</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Department Name</th>
                <th>Oldest Student</th>
            </tr>
        </thead>
        <tbody>
            {% for entry in department %}
                <tr>
                    <td>{{ entry.name }}</td>
                    <td>{{ entry.student_count }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
